<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Интернет-Магазины</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --danger-color: #dc2626;
            --danger-hover: #b91c1c;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-secondary: #64748b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 12px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button, .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--border-color);
        }

        .search-box {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            border-color: var(--accent-color);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            object-fit: contain;
            border-radius: 8px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-color);
            word-break: break-word;
            width: 100%;
        }

        .delete-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.2s, color 0.2s;
        }

        .card:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            color: var(--danger-color);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 16px;
            font-size: 1.2rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header>
            <h1>Мои Магазины</h1>
            <div class="controls">
                <button class="btn-secondary" id="themeToggle">🌙</button>
                <button id="addStoreBtn">+ Магазин</button>
            </div>
        </header>

        <input type="text" id="searchInput" class="search-box" placeholder="Поиск магазина...">

        <div class="grid" id="storesGrid">
            <!-- Сюда динамически добавляются плитки -->
        </div>
    </div>

    <!-- Модальное окно добавления -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h2>Добавить магазин</h2>
            <div class="form-group">
                <label for="storeName">Название</label>
                <input type="text" id="storeName" placeholder="Например: Ozon">
            </div>
            <div class="form-group">
                <label for="storeUrl">Ссылка (URL)</label>
                <input type="text" id="storeUrl" placeholder="https://ozon.ru">
            </div>
            <div class="modal-buttons">
                <button class="btn-secondary" id="cancelModal">Отмена</button>
                <button id="saveStore">Добавить</button>
            </div>
        </div>
    </div>

    <script>
        // Регистрация Service Worker для PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW registered!', reg))
                    .catch(err => console.log('SW failed', err));
            });
        }

        // Базовый список магазинов по умолчанию
        const defaultStores = [
            { name: "Ozon", url: "https://www.ozon.ru", icon: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" },
            { name: "Wildberries", url: "https://www.wildberries.ru", icon: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" },
            { name: "Яндекс Маркет", url: "https://market.yandex.ru", icon: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" },
            { name: "AliExpress", url: "https://aliexpress.ru", icon: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" },
            { name: "DNS", url: "https://www.dns-shop.ru", icon: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" },
            { name: "M.Video", url: "https://www.mvideo.ru", icon: "https://cdn-icons-png.flaticon.com/512/3081/3081559.png" }
        ];

        let stores = JSON.parse(localStorage.getItem('my_custom_stores')) || defaultStores;

        const grid = document.getElementById('storesGrid');
        const searchInput = document.getElementById('searchInput');
        const addModal = document.getElementById('addModal');
        const addStoreBtn = document.getElementById('addStoreBtn');
        const cancelModal = document.getElementById('cancelModal');
        const saveStoreBtn = document.getElementById('saveStore');
        const storeNameInput = document.getElementById('storeName');
        const storeUrlInput = document.getElementById('storeUrl');
        const themeToggle = document.getElementById('themeToggle');

        function renderStores(filter = '') {
            grid.innerHTML = '';
            const filtered = stores.filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));
            
            filtered.forEach((store, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <button class="delete-btn" title="Удалить" onclick="deleteStore(event, ${index})">&times;</button>
                    <img src="${store.icon || 'https://cdn-icons-png.flaticon.com/512/3081/3081559.png'}" class="card-icon" alt="${store.name}">
                    <div class="card-title">${store.name}</div>
                `;
                card.onclick = () => window.open(store.url, '_blank');
                grid.appendChild(card);
            });
        }

        window.deleteStore = function(event, index) {
            event.stopPropagation();
            if (confirm('Удалить этот магазин?')) {
                stores.splice(index, 1);
                localStorage.setItem('my_custom_stores', JSON.stringify(stores));
                renderStores(searchInput.value);
            }
        };

        searchInput.oninput = (e) => renderStores(e.target.value);

        addStoreBtn.onclick = () => addModal.classList.add('active');
        cancelModal.onclick = () => addModal.classList.remove('active');

        saveStoreBtn.onclick = () => {
            const name = storeNameInput.value.trim();
            let url = storeUrlInput.value.trim();
            if (!name || !url) return alert('Заполните все поля!');
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            stores.push({ name, url, icon: 'https://cdn-icons-png.flaticon.com/512/3081/3081559.png' });
            localStorage.setItem('my_custom_stores', JSON.stringify(stores));
            
            storeNameInput.value = '';
            storeUrlInput.value = '';
            addModal.classList.remove('active');
            renderStores(searchInput.value);
        };

        // Тема
        const savedTheme = localStorage.getItem('app_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

        themeToggle.onclick = () => {
            const current = document.body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('app_theme', next);
            themeToggle.textContent = next === 'dark' ? '🌙' : '☀️';
        };

        renderStores();
    </script>
</body>
</html>
