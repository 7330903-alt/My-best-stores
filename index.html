<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Магазины — Быстрые Закладки</title>
    
    <!-- PWA Manifest & Meta Tags (with unique ID to avoid cache conflict) -->
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D0%9C%D0%BE%D0%B8%20%D0%9C%D0%B0%D0%B3%D0%B0%D0%B7%D0%B8%D0%BD%D1%8B%202026%22%2C%22short_name%22%3A%22%D0%9C%D0%B0%D0%B3%D0%B0%D0%B7%D0%B8%D0%BD%D1%8B%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%232563eb%22%2C%22id%22%3A%22%2F%3Fapp%3Dmy-shopping-stores-v2%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fplacehold.co%2F192x192%2F2563eb%2Fffffff%3Ftext%3D%25F0%259F%259B%258D%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%252Fpng%22%7D%2C%7B%22src%22%3A%22https%3A%2F%2Fplacehold.co%2F512x512%2F2563eb%2Fffffff%3Ftext%3D%25F0%259F%259B%258D%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%252Fpng%22%7D%5D%7D">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f6ff',
                            100: '#e0edff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .store-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .store-card:hover {
            transform: translateY(-4px);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- Header Navigation -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid font-bold fa-bag-shopping text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl leading-tight">Мои Магазины</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Быстрый доступ к покупкам</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Theme Toggle Button -->
                <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Переключить тему">
                    <i id="themeIcon" class="fa-solid fa-moon text-lg"></i>
                </button>

                <!-- Add Store Button Header -->
                <button onclick="openAddModal()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-medium px-4 py-2 rounded-xl shadow-md shadow-blue-500/20 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Добавить</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8">
        
        <!-- Search & Filter Controls -->
        <div class="mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
            <div class="relative w-full sm:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterStores()" placeholder="Поиск магазина..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-sm">
            </div>

            <div class="text-xs text-slate-500 dark:text-slate-400 flex items-center gap-3 self-end sm:self-center">
                <span id="storeCountText">0 магазинов</span>
                <button id="installAppBtn" onclick="installApp()" class="hidden items-center space-x-1.5 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition shadow-sm">
                    <i class="fa-solid fa-download"></i>
                    <span>Установить приложение</span>
                </button>
            </div>
        </div>

        <!-- Stores Grid -->
        <div id="storesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Cards generated dynamically via JavaScript -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-full flex items-center justify-center mb-4 text-3xl">
                <i class="fa-solid fa-store-slash"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-200 mb-1">Ничего не найдено</h3>
            <p class="text-slate-500 dark:text-slate-400 text-sm max-w-sm mb-4">Попробуйте изменить поисковый запрос или добавьте новый магазин.</p>
            <button onclick="openAddModal()" class="inline-flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-xl text-sm transition">
                <i class="fa-solid fa-plus"></i>
                <span>Добавить магазин</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-400">
        <p>Быстрые закладки для покупок &copy; 2026</p>
    </footer>

    <!-- Modal: Store Preview / In-app View -->
    <div id="previewModal" class="fixed inset-0 z-50 hidden bg-slate-900/70 backdrop-blur-sm flex flex-col">
        <div class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-3 flex items-center justify-between shadow-md">
            <div class="flex items-center space-x-3 truncate">
                <span id="previewModalIcon" class="text-2xl">🛒</span>
                <div>
                    <h3 id="previewModalTitle" class="font-bold text-sm sm:text-base text-slate-800 dark:text-slate-100 truncate">Магазин</h3>
                    <p id="previewModalUrlText" class="text-xs text-slate-400 truncate">url</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <!-- Крупная кнопка открытия в браузере -->
                <a id="previewOpenExternal" href="#" target="_blank" rel="noopener noreferrer" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs sm:text-sm font-bold transition shadow-md shadow-blue-500/25">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    <span>В браузере</span>
                </a>
                <button onclick="closePreviewModal()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="Закрыть">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
        </div>
        <div class="flex-1 relative bg-slate-100 dark:bg-slate-900 w-full h-full">
            <div id="iframeLoader" class="absolute inset-0 flex flex-col items-center justify-center bg-white/80 dark:bg-slate-900/80 z-10">
                <i class="fa-solid fa-circle-notch fa-spin text-blue-600 text-3xl mb-2"></i>
                <p class="text-xs text-slate-500">Загрузка страницы...</p>
            </div>
            <iframe id="previewIframe" src="" class="w-full h-full border-0" onload="hideIframeLoader()"></iframe>
        </div>
    </div>

    <!-- Modal: Add / Edit Store Form -->
    <div id="storeFormModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-md overflow-hidden transform transition-all border border-slate-100 dark:border-slate-700">
            
            <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100 dark:border-slate-700">
                <h3 id="formModalTitle" class="font-bold text-lg text-slate-800 dark:text-slate-100">Добавить магазин</h3>
                <button onclick="closeFormModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="storeForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="storeId">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Название магазина *</label>
                    <input type="text" id="inputName" required placeholder="Например: Ozon" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Ссылка (URL) *</label>
                    <input type="url" id="inputUrl" required placeholder="https://www.ozon.ru" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Иконка (Эмодзи или Текст)</label>
                    <div class="flex gap-2">
                        <input type="text" id="inputIcon" placeholder="🛒" maxlength="4"
                            class="w-20 px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg">
                        
                        <div class="flex-1 flex items-center gap-1.5 overflow-x-auto py-1">
                            <button type="button" onclick="selectEmoji('🛍️')" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 text-base">🛍️</button>
                            <button type="button" onclick="selectEmoji('📦')" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 text-base">📦</button>
                            <button type="button" onclick="selectEmoji('👟')" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 text-base">👟</button>
                            <button type="button" onclick="selectEmoji('💻')" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 text-base">💻</button>
                            <button type="button" onclick="selectEmoji('🍎')" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 text-base">🍎</button>
                            <button type="button" onclick="selectEmoji('✨')" class="p-2 bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 text-base">✨</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1.5">Цвет карточки</label>
                    <div class="flex items-center gap-3">
                        <input type="color" id="inputColor" value="#3b82f6" class="w-10 h-10 rounded-xl cursor-pointer border-0 bg-transparent">
                        <span class="text-xs text-slate-500">Выберите акцентный цвет карточки</span>
                    </div>
                </div>

                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeFormModal()" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 text-sm font-medium transition">
                        Отмена
                    </button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium shadow-md shadow-blue-500/20 transition">
                        Сохранить
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const DEFAULT_STORES = [
            { id: '1', name: 'Ozon', url: 'https://www.ozon.ru', icon: '💙', color: '#005bff' },
            { id: '2', name: 'Wildberries', url: 'https://www.wildberries.ru', icon: '💜', color: '#a100ff' },
            { id: '3', name: 'Яндекс Маркет', url: 'https://market.yandex.ru', icon: '💛', color: '#ffcc00' },
            { id: '4', name: 'AliExpress', url: 'https://aliexpress.ru', icon: '🔴', color: '#ff4747' },
            { id: '5', name: 'Мегамаркет', url: 'https://megamarket.ru', icon: '🟢', color: '#24a148' },
            { id: '6', name: 'DNS', url: 'https://www.dns-shop.ru', icon: '🟠', color: '#ff6600' },
            { id: '7', name: 'Lamoda', url: 'https://www.lamoda.ru', icon: '👗', color: '#000000' },
            { id: '8', name: 'М.Видео', url: 'https://www.mvideo.ru', icon: '🔴', color: '#e4002b' }
        ];

        let stores = [];
        let deferredPrompt = null;

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadStores();
            renderStores();
        });

        // PWA Install Prompt Listener
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installAppBtn');
            if (installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex');
            }
        });

        async function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                const installBtn = document.getElementById('installAppBtn');
                if (installBtn) {
                    installBtn.classList.add('hidden');
                }
            }
            deferredPrompt = null;
        }

        function loadStores() {
            const saved = localStorage.getItem('my_shopping_stores_v2');
            if (saved) {
                try {
                    stores = JSON.parse(saved);
                } catch(e) {
                    stores = [...DEFAULT_STORES];
                }
            } else {
                stores = [...DEFAULT_STORES];
                saveStores();
            }
        }

        function saveStores() {
            localStorage.setItem('my_shopping_stores_v2', JSON.stringify(stores));
        }

        function renderStores(filterText = '') {
            const grid = document.getElementById('storesGrid');
            const emptyState = document.getElementById('emptyState');
            const countText = document.getElementById('storeCountText');
            
            grid.innerHTML = '';

            const filteredStores = stores.filter(s => 
                s.name.toLowerCase().includes(filterText.toLowerCase()) || 
                s.url.toLowerCase().includes(filterText.toLowerCase())
            );

            countText.textContent = `${filteredStores.length} ${pluralize(filteredStores.length, ['магазин', 'магазина', 'магазинов'])}`;

            if (filteredStores.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredStores.forEach(store => {
                    const card = createStoreCard(store);
                    grid.appendChild(card);
                });
            }
        }

        function createStoreCard(store) {
            let targetUrl = store.url;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            const card = document.createElement('div');
            card.className = 'store-card group relative bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex flex-col justify-between transition-all cursor-pointer';
            
            card.onclick = (e) => {
                if (e.target.closest('.card-actions')) return;
                openPreviewModal(store.id);
            };

            const domain = getDomain(targetUrl);
            const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

            card.innerHTML = `
                <!-- Options menu -->
                <div class="card-actions absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity flex items-center space-x-1 bg-white/90 dark:bg-slate-800/90 backdrop-blur-sm p-1 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm z-20">
                    <button onclick="openEditModal('${store.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition" title="Редактировать">
                        <i class="fa-solid fa-pen text-xs"></i>
                    </button>
                    <button onclick="deleteStore('${store.id}')" class="p-1.5 text-slate-400 hover:text-red-600 dark:hover:text-red-400 transition" title="Удалить">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                </div>

                <!-- Card Content -->
                <div class="flex flex-col items-center text-center py-2">
                    <div class="w-14 h-14 mb-3 rounded-2xl flex items-center justify-center text-2xl shadow-inner transition-transform group-hover:scale-105 relative" style="background-color: ${store.color || '#3b82f6'}15;">
                        <span class="z-10">${store.icon || '🛒'}</span>
                        <img src="${faviconUrl}" onerror="this.style.display='none'" class="absolute w-5 h-5 bottom-0 right-0 rounded-full border border-white dark:border-slate-800 shadow-sm" alt="">
                    </div>
                    <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm sm:text-base leading-snug truncate w-full mb-0.5">${escapeHtml(store.name)}</h3>
                    <p class="text-xs text-slate-400 truncate w-full">${escapeHtml(domain)}</p>
                </div>

                <!-- Footer indicator -->
                <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-xs text-slate-400 group-hover:text-blue-600 dark:group-hover:text-blue-400">
                    <span class="font-medium text-[11px]">Открыть</span>
                    <i class="fa-solid fa-window-maximize text-[10px]"></i>
                </div>
            `;
            return card;
        }

        function openPreviewModal(id) {
            const store = stores.find(s => s.id === id);
            if (!store) return;

            let targetUrl = store.url;
            if (!/^https?:\/\//i.test(targetUrl)) {
                targetUrl = 'https://' + targetUrl;
            }

            document.getElementById('previewModalTitle').textContent = store.name;
            document.getElementById('previewModalUrlText').textContent = getDomain(targetUrl);
            document.getElementById('previewModalIcon').textContent = store.icon || '🛒';
            
            const externalBtn = document.getElementById('previewOpenExternal');
            externalBtn.href = targetUrl;

            const iframe = document.getElementById('previewIframe');
            const loader = document.getElementById('iframeLoader');
            
            loader.style.display = 'flex';
            iframe.src = targetUrl;

            document.getElementById('previewModal').classList.remove('hidden');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('previewIframe').src = '';
        }

        function hideIframeLoader() {
            const loader = document.getElementById('iframeLoader');
            if (loader) {
                loader.style.display = 'none';
            }
        }

        function openAddModal() {
            document.getElementById('formModalTitle').textContent = 'Добавить магазин';
            document.getElementById('storeForm').reset();
            document.getElementById('storeId').value = '';
            document.getElementById('inputColor').value = '#3b82f6';
            
            const modal = document.getElementById('storeFormModal');
            modal.classList.remove('hidden');
        }

        function openEditModal(id) {
            const store = stores.find(s => s.id === id);
            if (!store) return;

            document.getElementById('formModalTitle').textContent = 'Редактировать магазин';
            document.getElementById('storeId').value = store.id;
            document.getElementById('inputName').value = store.name;
            document.getElementById('inputUrl').value = store.url;
            document.getElementById('inputIcon').value = store.icon || '';
            document.getElementById('inputColor').value = store.color || '#3b82f6';

            const modal = document.getElementById('storeFormModal');
            modal.classList.remove('hidden');
        }

        function closeFormModal() {
            document.getElementById('storeFormModal').classList.add('hidden');
        }

        function selectEmoji(emoji) {
            document.getElementById('inputIcon').value = emoji;
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            
            const id = document.getElementById('storeId').value;
            const name = document.getElementById('inputName').value.trim();
            let url = document.getElementById('inputUrl').value.trim();
            const icon = document.getElementById('inputIcon').value.trim() || '🛒';
            const color = document.getElementById('inputColor').value;

            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            if (id) {
                const index = stores.findIndex(s => s.id === id);
                if (index !== -1) {
                    stores[index] = { id, name, url, icon, color };
                }
            } else {
                const newStore = {
                    id: Date.now().toString(),
                    name,
                    url,
                    icon,
                    color
                };
                stores.push(newStore);
            }

            saveStores();
            renderStores(document.getElementById('searchInput').value);
            closeFormModal();
        }

        function deleteStore(id) {
            const store = stores.find(s => s.id === id);
            if (!store) return;

            if (window.confirm(`Вы действительно хотите удалить магазин "${store.name}"?`)) {
                stores = stores.filter(s => s.id !== id);
                saveStores();
                renderStores(document.getElementById('searchInput').value);
            }
        }

        function filterStores() {
            const query = document.getElementById('searchInput').value;
            renderStores(query);
        }

        function getDomain(urlStr) {
            try {
                const url = new URL(urlStr);
                return url.hostname.replace('www.', '');
            } catch (e) {
                return urlStr;
            }
        }

        function pluralize(number, titles) {
            const cases = [2, 0, 1, 1, 1, 2];
            return titles[(number % 100 > 4 && number % 100 < 20) ? 2 : cases[(number % 10 < 5) ? number % 10 : 5]];
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeIcon(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeIcon(false);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeIcon(isDark);
        }

        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (isDark) {
                icon.className = 'fa-solid fa-sun text-yellow-400 text-lg';
            } else {
                icon.className = 'fa-solid fa-moon text-slate-600 text-lg';
            }
        }
    </script>
</body>
</html>
